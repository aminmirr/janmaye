<!DOCTYPE html>
<html lang="fa" dir="rtl" data-lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جان‌مایه — خلاصه‌های صوتی کتاب</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#0E1519">
<meta name="description" content="مرور صوتیِ کتاب‌ها به فارسی، برای رسیدن سریع به اصل حرفِ کتاب — از جمله کتاب‌هایی که هنوز ترجمه‌ی فارسی ندارند. ساخته‌شده با NotebookLM و با کمک Claude code و Github. جایگزینِ خواندنِ کتاب نیست.">
<meta property="og:type" content="website">
<meta property="og:title" content="جان‌مایه — خلاصه‌های صوتی کتاب">
<meta property="og:description" content="مرور صوتیِ کتاب‌ها به فارسی، برای رسیدن سریع به اصل حرفِ کتاب — از جمله کتاب‌هایی که هنوز ترجمه‌ی فارسی ندارند.">
<meta property="og:url" content="https://aminmirr.github.io/janmaye/">
<meta property="og:image" content="https://aminmirr.github.io/janmaye/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,500;1,6..72,300&family=Vazirmatn:wght@300;500;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E1519; --ink-raise:#141E24; --line:#23313A;
  --paper:#EDEAE3; --haze:#7E909C;
  --verdigris:#57A99B; --saffron:#E0A458;
  --accent:var(--verdigris);
  --gutter:clamp(20px,5vw,64px);
  --bar-h:76px;
}
html[data-lang="fa"]{ --accent:var(--saffron); }
*{ box-sizing:border-box; margin:0; padding:0; }
html{ background:var(--ink); scroll-behavior:smooth; }
body{
  background:var(--ink); color:var(--paper);
  font-family:'Vazirmatn',system-ui,sans-serif; font-weight:300; line-height:1.7;
  -webkit-font-smoothing:antialiased; padding-bottom:var(--bar-h);
}
body.has-player{ padding-bottom:calc(var(--bar-h) + 24px); }
.wrap{ max-width:clamp(960px,95vw,1360px); margin-inline:auto; padding-inline:var(--gutter); }

.mono{ font-family:'JetBrains Mono',ui-monospace,monospace; font-weight:400;
  font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; }
html[data-lang="fa"] .mono{ font-family:'Vazirmatn',sans-serif; letter-spacing:0;
  text-transform:none; font-size:.78rem; }
.num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

/* masthead */
.masthead{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:26px 0; }
.mark{ display:flex; align-items:center; gap:10px; color:var(--haze); }
.mark-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); transition:background .45s ease; }

/* hero */
.hero{ padding-block:clamp(52px,10vw,100px) clamp(36px,6vw,64px); }
.eyebrow{ color:var(--haze); margin-bottom:22px; }
.headline{ font-family:'Newsreader',Georgia,serif; font-weight:300;
  font-size:clamp(2.2rem,6vw,4.2rem); line-height:1.07; letter-spacing:-.015em;
  max-width:18ch; text-wrap:balance; }
html[data-lang="fa"] .headline{ font-family:'Vazirmatn',sans-serif; font-weight:800;
  font-size:clamp(1.8rem,5vw,3.3rem); line-height:1.34; letter-spacing:-.01em; max-width:22ch; }
.headline em{ font-style:italic; color:var(--accent); transition:color .45s ease; }
html[data-lang="fa"] .headline em{ font-style:normal; }
.standfirst{ color:var(--haze); margin-top:22px; max-width:52ch; font-size:1.02rem; }

.stats{ display:flex; flex-wrap:wrap; gap:14px 44px; margin-top:clamp(36px,6vw,56px);
  padding-top:26px; border-top:1px solid var(--line); }
.stat b{ display:block; font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;
  font-weight:500; font-size:1.5rem; color:var(--paper); line-height:1.3; }
html[data-lang="fa"] .stat b{ font-family:'Vazirmatn',sans-serif; font-weight:800; }
.stat span{ color:var(--haze); }
.stat.is-key b{ color:var(--accent); transition:color .45s ease; }

/* book */
.book{ padding-block:clamp(30px,4.5vw,44px); border-bottom:1px solid var(--line); }
.book-top{ display:grid; grid-template-columns:1fr auto; gap:20px 28px; align-items:start; }
.book-top>.book-note,.book-top>.book-cats{ grid-column:1/-1; margin-top:0; }
.book-id{ display:flex; gap:clamp(14px,3vw,22px); align-items:flex-start; min-width:0; }
.cover{ width:clamp(58px,11vw,92px); aspect-ratio:2/3; object-fit:cover; flex:none;
  border-radius:3px; border:1px solid var(--line); background:var(--ink-raise);
  box-shadow:0 1px 0 0 color-mix(in srgb,var(--paper) 8%,transparent) inset; }
.titles{ min-width:0; }
/* English title: always the bold serif display line */
.book-title-en{ font-family:'Newsreader',Georgia,serif; font-weight:500;
  font-size:clamp(1.35rem,3vw,1.95rem); line-height:1.18; letter-spacing:-.01em; }
.book-title-fa{ font-family:'Vazirmatn',sans-serif; font-weight:500; direction:rtl;
  font-size:clamp(1rem,2.2vw,1.28rem); line-height:1.5; margin-top:5px;
  color:color-mix(in srgb,var(--paper) 82%,var(--ink)); }
.no-fa{ position:relative; display:inline-flex; align-items:center; justify-content:center;
  vertical-align:middle; margin-inline-start:12px; width:76px; height:76px;
  background-image:url(seal-badge.png); background-size:contain;
  background-position:center; background-repeat:no-repeat; }
.no-fa span{ font-family:'JetBrains Mono',monospace; font-weight:700; font-size:.36rem;
  letter-spacing:0; text-transform:uppercase; line-height:1.4; color:#5c3a0c;
  text-align:center; max-width:48px; }
html[data-lang="fa"] .no-fa{ width:84px; height:84px; }
html[data-lang="fa"] .no-fa span{ font-family:'Vazirmatn',sans-serif; font-weight:800;
  text-transform:none; letter-spacing:0; font-size:.52rem; max-width:46px; }
.book-author{ color:var(--haze); margin-top:10px; font-size:.9rem; }
.book-author::before{ content:"—  "; opacity:.6; }

/* per-book language — which of that book's two audio languages you're
   browsing/listening to. Small and scoped, unlike the old site-wide toggle. */
.book-lang{ display:inline-flex; border:1px solid var(--line); border-radius:999px;
  overflow:hidden; margin-top:12px; }
.book-lang button{ font:inherit; font-family:'Vazirmatn',sans-serif; background:none; border:0;
  cursor:pointer; color:var(--haze); padding:5px 13px; font-size:.75rem;
  transition:color .2s,background .2s; }
.book-lang button[aria-pressed="true"]{ color:var(--ink); background:var(--accent); }
.book-lang button:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

.book-note{ margin-top:14px; font-size:.95rem;
  color:color-mix(in srgb,var(--paper) 74%,var(--ink)); }

/* search + categories share one wrapping row */
.filters{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; padding-block:8px 0; }
/* underline, not a pill: separation by line, matching the rest of the page */
.search{ display:inline-flex; align-items:center; gap:9px; flex:none;
  border-bottom:1px solid var(--line); padding-block:7px; transition:border-color .2s; }
.search:focus-within{ border-color:var(--accent); }
.search > svg{ width:13px; height:13px; flex:none; fill:none; stroke:var(--haze);
  stroke-width:2; stroke-linecap:round; }
.search:focus-within > svg{ stroke:var(--accent); }
.search input{ font:inherit; font-size:.84rem; width:24ch; padding:0;
  background:none; border:0; outline:none; color:var(--paper); }
.search input::placeholder{ color:var(--haze); opacity:1; }
.search input::-webkit-search-cancel-button{ -webkit-appearance:none; appearance:none; }
html[data-lang="fa"] .search input{ font-family:'Vazirmatn',sans-serif; }
#qClear{ font:inherit; font-size:1.1rem; line-height:1; cursor:pointer; flex:none;
  background:none; border:0; padding:0 2px; color:var(--haze); transition:color .2s; }
#qClear:hover{ color:var(--paper); }
#qClear:focus-visible,.search input:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

/* categories — filter bar + per-book chips */
.cats{ display:flex; flex-wrap:wrap; gap:9px; padding-block:0; }
.cats[hidden]{ display:none; }
.cat{ font:inherit; font-size:.8rem; cursor:pointer; background:none;
  color:var(--haze); border:1px solid var(--line); border-radius:999px;
  padding:6px 14px; transition:color .2s,border-color .2s,background .2s; }
.cat:hover{ color:var(--paper); border-color:var(--haze); }
.cat[aria-pressed="true"]{ color:var(--ink); background:var(--accent); border-color:var(--accent); }
.cat:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
html[data-lang="fa"] .cat{ font-family:'Vazirmatn',sans-serif; }
.book-cats{ display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
.book-cats .cat{ font-size:.72rem; padding:4px 11px; }

/* continue-listening row — recently started, unfinished episodes across all books */
.continue-wrap{ margin-top:8px; }
.continue-wrap[hidden]{ display:none; }
.continue-title{ color:var(--haze); margin-bottom:12px; }
.continue-row{ display:flex; gap:14px; overflow-x:auto; padding-block:2px 8px; }
.continue-card{ flex:none; width:168px; display:flex; flex-direction:column; gap:7px;
  background:none; border:0; padding:0; cursor:pointer; text-align:start; font:inherit; color:inherit; }
.continue-card:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.continue-cover{ width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:4px;
  border:1px solid var(--line); background:var(--ink-raise); }
.continue-book{ font-size:.82rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.continue-ep{ font-size:.75rem; color:var(--haze); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.continue-bar{ height:2px; background:var(--line); border-radius:2px; overflow:hidden; }
.continue-bar-fill{ height:100%; background:var(--accent); }

/* whole-book: play + download side by side */
.book-side{ display:flex; flex-wrap:wrap; gap:10px; align-items:center;
  max-width:260px; justify-content:flex-end; }
.whole-dl{ display:inline-flex; align-items:center; justify-content:center;
  width:40px; height:40px; flex:none; color:var(--haze); text-decoration:none;
  border:1px solid var(--line); border-radius:999px; transition:color .2s,border-color .2s; }
.whole-dl:hover{ color:var(--accent); border-color:var(--accent); }
.whole-dl:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.whole-dl svg{ width:14px; height:14px; fill:currentColor; }

/* like / dislike */
.votes{ display:flex; gap:8px; margin-top:14px; }
.vote{ font:inherit; font-size:.8rem; cursor:pointer; background:none; color:var(--haze);
  border:1px solid var(--line); border-radius:999px; padding:5px 13px;
  display:inline-flex; align-items:center; gap:7px;
  transition:color .2s,border-color .2s,background .2s; }
.vote:hover{ color:var(--paper); border-color:var(--haze); }
.vote[aria-pressed="true"]{ color:var(--accent); border-color:var(--accent); }
.vote:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.vote .num{ font-size:.78rem; min-width:1ch; text-align:center; }
.vote svg{ width:11px; height:11px; fill:currentColor; }

/* suggestion sheet */
dialog.sheet{ border:1px solid var(--line); border-radius:14px; background:var(--ink-raise);
  color:var(--paper); padding:0; max-width:440px; width:calc(100% - 32px);
  margin:auto; }   /* the *{margin:0} reset kills native centering — restore it */
dialog.sheet::backdrop{ background:rgba(6,10,12,.6); backdrop-filter:blur(3px); }
.sheet-close{ position:absolute; inset-block-start:12px; inset-inline-end:12px; z-index:2;
  width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center;
  background:none; border:0; border-radius:50%; cursor:pointer; color:var(--haze);
  transition:color .2s,background .2s; }
.sheet-close:hover{ color:var(--paper); background:color-mix(in srgb,var(--paper) 8%,transparent); }
.sheet-close:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.sheet-close svg{ width:14px; height:14px; fill:currentColor; }
.sheet-panel h3{ padding-inline-end:28px; }   /* room for the × */
.sheet-panel{ padding:clamp(20px,4vw,30px); display:flex; flex-direction:column; gap:14px; }
.sheet-panel[hidden]{ display:none; }
.sheet h3{ font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:1.4rem; }
html[data-lang="fa"] .sheet h3{ font-family:'Vazirmatn',sans-serif; font-weight:800; }
.sheet-lead{ color:var(--haze); font-size:.92rem; margin-top:-4px; }
.sheet label{ display:flex; flex-direction:column; gap:5px; font-size:.82rem; color:var(--haze); }
.sheet input,.sheet textarea{ font:inherit; font-size:.95rem; color:var(--paper);
  background:var(--ink); border:1px solid var(--line); border-radius:8px; padding:9px 12px; }
.sheet input:focus,.sheet textarea:focus{ outline:none; border-color:var(--accent); }
.sheet textarea{ resize:vertical; min-height:64px; }
.sheet-actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:4px; }
.sheet-actions.col{ flex-direction:column; margin-top:6px; }
.sheet-actions button,.sheet-actions a{ font:inherit; cursor:pointer; border-radius:999px;
  padding:11px 18px; font-size:.9rem; text-decoration:none; text-align:center;
  display:inline-flex; align-items:center; justify-content:center; gap:9px; }
.sheet-actions.col button,.sheet-actions.col a{ width:100%; }
html[data-lang="fa"] .sheet-actions button,html[data-lang="fa"] .sheet-actions a{ font-family:'Vazirmatn',sans-serif; }
.btn-ghost{ background:none; color:var(--haze); border:1px solid var(--line); }
.btn-ghost:hover{ color:var(--paper); border-color:var(--haze); }
.btn-primary{ background:var(--accent); color:var(--ink); border:1px solid var(--accent); font-weight:500; }
.btn-primary:hover{ filter:brightness(1.08); }
.btn-primary[disabled]{ opacity:.5; cursor:default; }
.btn-primary svg{ width:16px; height:16px; fill:currentColor; }
.sheet-msg{ color:var(--accent); font-size:.85rem; }
.sheet-msg.err{ color:var(--saffron); }
#suggest{ cursor:pointer; }

.whole{ display:inline-flex; align-items:center; justify-content:center; gap:10px;
  font:inherit; font-size:.9rem; cursor:pointer; white-space:nowrap; min-width:0;
  background:var(--accent); color:var(--ink); border:1px solid var(--accent);
  border-radius:999px; padding:11px 20px; transition:filter .2s; }
.whole:hover{ filter:brightness(1.08); }
.whole:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.whole svg{ width:12px; height:12px; flex:none; fill:currentColor; }
.whole span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.whole small{ opacity:.6; font-size:.8em; flex:none; }
.whole small svg{ width:10px; height:10px; vertical-align:-1px; margin-inline-end:4px; }

/* the spine — width of each segment ∝ chapter length */
.spine-wrap{ margin-top:26px; }
.spine{ display:flex; gap:2px; height:26px; align-items:stretch; }
.seg{ position:relative; flex:1 1 0; min-width:7px; padding:0; border:0; cursor:pointer;
  background:color-mix(in srgb,var(--accent) 30%,transparent);
  border-radius:2px; overflow:hidden; transition:background .2s ease; }
.seg:hover{ background:color-mix(in srgb,var(--accent) 55%,transparent); }
.seg:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.seg[data-done="1"]{ background:color-mix(in srgb,var(--accent) 60%,transparent); }
.seg[data-now="1"]{ background:color-mix(in srgb,var(--accent) 30%,transparent); }
.seg-fill{ position:absolute; inset-block:0; inset-inline-start:0; width:0; background:var(--accent); }

.spine-meta{ display:flex; justify-content:space-between; align-items:center;
  gap:16px; margin-top:12px; color:var(--haze); }
.spine-meta .right{ display:flex; align-items:center; gap:14px; }
.dl-all{ display:inline-flex; align-items:center; gap:6px; color:var(--haze);
  text-decoration:none; padding:4px 0; transition:color .2s; }
.dl-all:hover{ color:var(--paper); }
.dl-all:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.dl-all svg{ width:12px; height:12px; fill:currentColor; }
.dl-all .size{ opacity:.75; }
.toc-toggle{ font:inherit; background:none; border:0; cursor:pointer; color:var(--haze);
  display:inline-flex; align-items:center; gap:7px; padding:4px 0; }
.toc-toggle:hover{ color:var(--paper); }
.toc-toggle:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
.toc-toggle svg{ width:10px; height:10px; fill:currentColor; transition:transform .25s ease; }
.toc-toggle[aria-expanded="true"] svg{ transform:rotate(180deg); }

/* chapter list */
.toc{ margin-top:20px; border-top:1px solid var(--line); }
.toc[hidden]{ display:none; }
/* row = the play button plus its actions as siblings; nesting buttons inside the
   row button would be invalid HTML and break click and focus handling */
.ch-row{ display:flex; align-items:center; gap:2px;
  border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent); }
.ch{ display:grid; grid-template-columns:auto 1fr auto; align-items:center;
  gap:16px; padding-block:11px; flex:1; min-width:0; border:0;
  background:none; text-align:start;
  font:inherit; color:var(--paper); cursor:pointer; transition:color .2s; }
.ch:hover{ color:var(--accent); }
.ch:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
.ch-act{ display:flex; align-items:center; justify-content:center; flex:none;
  width:30px; height:30px; padding:0; border:0; border-radius:6px; background:none;
  color:var(--haze); text-decoration:none; cursor:pointer;
  transition:color .2s, background .2s; }
.ch-act:hover{ color:var(--paper); background:color-mix(in srgb,var(--paper) 8%,transparent); }
.ch-act:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.ch-act svg{ width:14px; height:14px; fill:currentColor; }
.ch-act svg[stroke]{ fill:none; }
.ch-act.ok{ color:var(--verdigris); }
.ch-n{ color:var(--haze); font-family:'JetBrains Mono',monospace; font-size:.78rem; font-variant-numeric:tabular-nums; }
.ch[data-now="1"] .ch-n, .ch[data-now="1"]{ color:var(--accent); }
.ch-t{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.96rem; }
.ch-d{ color:var(--haze); font-size:.8rem; white-space:nowrap; }
.ch-played{ display:inline-flex; width:11px; height:11px; margin-inline-end:5px;
  vertical-align:-1px; color:var(--accent); }
.ch-played svg{ width:100%; height:100%; }
.missing{ color:var(--haze); }

/* sticky player */
.player{ position:fixed; inset-inline:0; bottom:0; z-index:20;
  background:color-mix(in srgb,var(--ink-raise) 92%,transparent);
  backdrop-filter:blur(14px); border-top:1px solid var(--line);
  transform:translateY(110%); transition:transform .35s cubic-bezier(.16,1,.3,1); }
.player.on{ transform:none; }
.player-scrub{ height:3px; background:var(--line); cursor:pointer; position:relative; touch-action:none; }
.player-scrub-fill{ position:absolute; inset-block:0; inset-inline-start:0; width:0; background:var(--accent); }
.player-scrub-thumb{ position:absolute; inset-block-start:50%; inset-inline-start:0;
  width:12px; height:12px; margin-inline-start:-6px; border-radius:50%;
  background:var(--accent); transform:translateY(-50%);
  box-shadow:0 0 0 8px transparent; transition:box-shadow .15s ease; }
.player-scrub:hover .player-scrub-thumb,
.player-scrub-thumb:active{ box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent); }
.player-body{ max-width:1000px; margin-inline:auto; padding:12px var(--gutter);
  display:flex; align-items:center; gap:16px; height:calc(var(--bar-h) - 3px); }
.pbtn{ font:inherit; background:none; border:0; cursor:pointer; color:var(--haze);
  padding:8px; display:inline-flex; border-radius:50%; transition:color .2s; }
.pbtn:hover{ color:var(--paper); }
.pbtn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.pbtn[disabled]{ opacity:.3; cursor:default; }
.pbtn svg{ width:15px; height:15px; fill:currentColor; }
.pbtn.main{ color:var(--ink); background:var(--accent); padding:11px; }
.pbtn.main:hover{ color:var(--ink); filter:brightness(1.1); }
.pbtn.skip svg{ width:22px; height:22px; fill:none; }   /* 15s replay/forward (stroked + "15") */
html[dir="rtl"] .pbtn.flip svg{ transform:scaleX(-1); }
.pspeed{ font-family:'JetBrains Mono',monospace; font-size:.72rem; font-variant-numeric:tabular-nums;
  background:none; border:1px solid var(--line); color:var(--haze); cursor:pointer;
  border-radius:999px; padding:5px 9px; min-width:46px; text-align:center; white-space:nowrap;
  transition:color .2s,border-color .2s; }
.pspeed:hover{ color:var(--paper); border-color:var(--haze); }
.pspeed:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.pnow{ flex:1; min-width:0; }
.pnow b{ display:block; font-weight:500; font-size:.92rem; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.pnow span{ color:var(--haze); font-size:.78rem; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; display:block; }

<script>
/* Visitor stats via GoatCounter: cookie-free, no personal data, no consent banner.
   Set GC_SITE to your GoatCounter site code (https://<code>.goatcounter.com) to turn
   it on; while it is empty nothing is loaded and nothing is sent. */
const GC_SITE = "aminmir";
if(GC_SITE && location.hostname !== "localhost" && location.hostname !== "127.0.0.1"){
  const gc = document.createElement("script");
  gc.async = true;
  gc.src = "https://gc.zgo.at/count.js";
  gc.dataset.goatcounter = `https://${GC_SITE}.goatcounter.com/count`;
  document.head.appendChild(gc);
}
/* A named event. Safe to call whether or not the counter is on or has loaded yet. */
function stat(name, title){
  try{ window.goatcounter && window.goatcounter.count && window.goatcounter.count({path:name, title:title||name, event:true}); }catch{}
}
</script>

let META = {};   // slug -> hand-edited { title_en, title_fa, author, cover, note_en, note_fa }

audio.addEventListener("play", ()=>{

  playedThisVisit.add(tr.src);                    // pause/resume must not count twice

const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const t  = ()=>T.fa;
const num = n => n.toLocaleString("fa-IR");
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const langKey = lang => lang==="fa" ? "Persian" : "English";
/* Whole megabytes: the number exists to set expectations before a long download,
   and a decimal implies a precision nobody acts on. */
const mb = bytes => `${num(Math.round(bytes/1048576))} ${t().mb}`;
const isWhole = ep => /whole_book/.test(ep.url);
const chapKey = url => url.split("/").pop().replace(/\.m4a$/,"").replace(/_(en|fa)$/,"");
function chTitle(slug, ep, lang){
  const chs = META[slug] && META[slug].chapters;
  const ov = chs && chs[chapKey(ep.url)];
  if(ov){ return (lang==="fa" ? ov.title_fa : ov.title_en) || ov.title_en || ep.title; }
  return ep.title;
}
const bookCats = slug => (META[slug] && META[slug].categories) || [];
let CAT = null;   // active category filter
let Q = "";       // active search query (normalised)

/* Persian needs folding or the box quietly fails: "خلاصه‌های" is written with a
   zero-width non-joiner, so typing a plain space never matches it, and Arabic ي/ك
   are visually identical to Persian ی/ک on most keyboards. */
const norm = s => (s || "").toLowerCase()
  .replace(/‌/g, " ")
  .replace(/[يى]/g, "ی").replace(/ك/g, "ک")
  .replace(/\s+/g, " ").trim();

/* What a book is searchable by. Returns null for no match, or whether the hit came
   from a chapter — which decides if its list gets opened to show why it matched. */
function matchBook(b){
  if(!Q) return { hit:true, viaChapter:false };
  const m = META[b.slug] || {};
  const head = [m.title_en, m.title_fa, b.title, m.author, m.note_en, m.note_fa,
                ...bookCats(b.slug)];
  if(head.some(v => norm(v).includes(Q))) return { hit:true, viaChapter:false };
  // Both languages, always — there's no site-wide language for search to follow,
  // and a book currently showing Persian chapters must still be found by an
  // English chapter title (and vice versa).
  const inChapter = ["fa","en"].some(lang =>
    split(b, lang).chapters.some(c => norm(chTitle(b.slug, c, lang)).includes(Q)));
  return inChapter ? { hit:true, viaChapter:true } : null;
}

/* split a book's episodes for the current language into {full, chapters[]} */
function split(book, lang){
  const eps = (book.episodes && book.episodes[langKey(lang)]) || [];
  return { full: eps.find(isWhole) || null,
           chapters: eps.filter(e=>!isWhole(e)) };
}

/* ---------------- listening history (localStorage, same-device only) ----------------
   Resume position + finished/in-progress state, keyed by episode audio URL (unique per
   book, chapter and language). See docs/superpowers/specs/2026-09-17-listening-history-design.md */
const HISTORY_KEY="abs-history";
const RESUME_MIN_SECONDS=5;      // ignore a resume position this close to the start
const PLAYED_RATIO=0.95;         // finished enough to count as "played"
const CONTINUE_ROW_LIMIT=4;

function shouldMarkPlayed(position,duration){
  return !!duration && duration>0 && (position/duration)>=PLAYED_RATIO;
}
function shouldResume(entry){
  return !!entry && !entry.played && (entry.position||0) > RESUME_MIN_SECONDS;
}
function continueEntries(history){
  return Object.keys(history).map(url=>({url,...history[url]})).filter(shouldResume);
}
function mostRecentInProgress(history,slug){
  const list=continueEntries(history).filter(e=>e.slug===slug);
  return list.length ? list.reduce((a,b)=>b.at>a.at?b:a) : null;
}
function continueListening(history,limit=CONTINUE_ROW_LIMIT){
  return continueEntries(history).sort((a,b)=>b.at-a.at).slice(0,limit);
}

function loadHistory(){
  const raw=localStorage.getItem(HISTORY_KEY);
  if(!raw) return {};
  try{ return JSON.parse(raw); }catch{ return {}; }
}
function saveHistory(history){ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
const HISTORY = loadHistory();

/* tr is a track object from mkTrack() — carries slug/kind/idx/book/label/src already,
   so nothing needs re-deriving from the DOM. Sticky: once played, stays played. */
function recordEntry(tr, position, duration, forcePlayed){
  const prev = HISTORY[tr.src];
  HISTORY[tr.src] = {
    position, duration,
    played: forcePlayed || (prev && prev.played) || shouldMarkPlayed(position, duration),
    at: Date.now(),
    slug: tr.slug, lang: tr.lang, kind: tr.kind, idx: tr.idx, book: tr.book, label: tr.label,
  };
  saveHistory(HISTORY);
}

let lastHistoryWriteAt = 0;
const HISTORY_WRITE_INTERVAL_MS = 5000;
function maybeRecordProgress(){
  const tr=cur(); if(!tr || !audio.duration) return;
  const now=Date.now();
  if(now - lastHistoryWriteAt < HISTORY_WRITE_INTERVAL_MS) return;
  lastHistoryWriteAt = now;
  recordEntry(tr, audio.currentTime, audio.duration, false);
}
function forceRecordProgress(played){
  const tr=cur(); if(!tr || !audio.duration) return;
  lastHistoryWriteAt = Date.now();
  recordEntry(tr, audio.currentTime, audio.duration, played);
}

/* ---------------- render ---------------- */
function render(){
  const L=t();
  document.title = "جان‌مایه — خلاصه‌های صوتی کتاب";
  $$("[data-i18n]").forEach(e=>e.textContent=L[e.dataset.i18n]||"");
  $$("[data-i18n-label]").forEach(e=>e.setAttribute("aria-label",L[e.dataset.i18nLabel]||""));
  $$("[data-i18n-ph]").forEach(e=>e.placeholder=L[e.dataset.i18nPh]||"");
  $("#headline").innerHTML=L.headline;
  if(!DATA) return;

  const books=DATA.books||[];
  if(!books.length){ $("#msg").textContent=L.empty; return; }

  let eps=0, listen=0;
  books.forEach(b=>{
    // Fixed to "fa" regardless of any book's current toggle state — a stat that
    // jumped around every time a visitor flipped one book's language would be
    // more confusing than useful.
    const {full,chapters}=split(b, "fa");
    if(full){ eps++; listen += full.seconds||0; }
    chapters.forEach(c=>{ eps++; listen += c.seconds||0; });
  });
  $("#sBooks").textContent=num(books.length);
  $("#sEps").textContent=num(eps);
  $("#sListen").textContent=dur(listen);
  $("#stats").hidden=false; $("#msg").hidden=true;

  renderCats(books);
  const byCat = CAT ? books.filter(b=>bookCats(b.slug).includes(CAT)) : books;
  const hits = byCat.map(b=>[b, matchBook(b)]).filter(([,m])=>m);

  const open = new Set($$(".toc-toggle[aria-expanded='true']").map(b=>b.dataset.slug));
  for(const k in refs) delete refs[k];
  $("#list").innerHTML="";
  // a chapter-only match opens that book's list, so the reason it matched is visible
  hits.forEach(([b,m])=>$("#list").append(bookEl(b, m.viaChapter || open.has(b.slug))));

  if(!hits.length){
    $("#msg").hidden=false;
    $("#msg").textContent = Q ? `${L.noResults} “${$("#q").value.trim()}”` : L.empty;
  }
  paintSpines();
  paintVotes();
  renderContinueRow();
}

function renderCats(books){
  const all = [...new Set(books.flatMap(b=>bookCats(b.slug)))].sort((a,b)=>a.localeCompare(b));
  const nav = $("#cats");
  if(!all.length){ nav.hidden=true; nav.innerHTML=""; return; }
  nav.hidden=false;
  const chip = (label,val,on)=>{
    const b=document.createElement("button");
    b.type="button"; b.className="cat"; b.textContent=label;
    b.setAttribute("aria-pressed",String(on));
    b.addEventListener("click",()=>{ CAT = (CAT===val)?null:val; render(); });
    return b;
  };
  nav.innerHTML="";
  nav.append(chip(t().all,null,CAT===null));
  all.forEach(c=>nav.append(chip(c,c,CAT===c)));
}

          ${titleFa?`<p class="book-title-fa">${esc(titleFa)}</p>`:""}
          ${author?`<p class="book-author">${esc(author)}</p>`:""}
          <div class="book-lang" role="group" aria-label="زبان این کتاب">
            <button type="button" data-book-lang="fa" aria-pressed="${bLang==="fa"}">فارسی</button>
            <button type="button" data-book-lang="en" aria-pressed="${bLang==="en"}">English</button>
          </div>
        </div>
      </div>
      <div class="book-side"></div>
      ${note?`<p class="book-note" dir="${bDir}">${esc(note)}</p>`:""}
      <div class="book-cats"></div>
    </div>
    <div class="spine-wrap" dir="${bDir}">
      <div class="spine" role="group" aria-label="${esc(L.chapters)}"></div>
      <div class="spine-meta">
        <button type="button" class="toc-toggle mono" data-slug="${esc(b.slug)}" aria-expanded="${openToc}">
          ${ICON_CHEV}<span class="toc-label"></span>
        </button>
        <div class="right mono">

  $$("[data-book-lang]",el).forEach(btn=>btn.addEventListener("click",()=>{
    const newLang=btn.dataset.bookLang;

    switchBookLang(b.slug, newLang);

  // "download everything in this language" — a zip built at publish time and
  // shipped as a release asset. Absent for books published before zips existed.
  const zip = (b.zips || {})[langKey(bLang)];
  if(zip){
    const za=document.createElement("a");

      +`<span class="size">${esc(mb(zip.bytes))}</span>`;
    za.title=`${L.dlAll} — ${num(zip.count)} ${L.files} · ${mb(zip.bytes)}`;
    $(".spine-meta .right",el).prepend(za);
  }

  const R = refs[b.slug] = { segs:[], fills:[], chs:[], whole:null, el };

  // per-book category chips (clickable → filter)
  const catBox=$(".book-cats",el), cats=bookCats(b.slug).slice(0,3);
  if(cats.length){
    cats.forEach(c=>{
      const cb=document.createElement("button");
      cb.type="button"; cb.className="cat"; cb.textContent=c;
      cb.setAttribute("aria-pressed",String(CAT===c));
      cb.addEventListener("click",()=>{ CAT=(CAT===c)?null:c; render(); scrollTo({top:0,behavior:"smooth"}); });
      catBox.append(cb);
    });
  } else catBox.remove();

  // like / dislike
  const votesBox=document.createElement("div"); votesBox.className="votes";
  const mkVote=(icon,val,label)=>{
    const btn=document.createElement("button");
    btn.type="button"; btn.className="vote"; btn.setAttribute("aria-label",label);
    btn.innerHTML=`${icon}<span class="num">0</span>`;
    btn.addEventListener("click",()=>castVote(b.slug, val));
    return btn;
  };
  const up=mkVote(ICON_UP,1,L.like), down=mkVote(ICON_DOWN,-1,L.dislike);
  votesBox.append(up,down);
  $(".titles",el).append(votesBox);
  R.vote={ up, down, upN:$(".num",up), downN:$(".num",down) };

  // whole-book: play + download
  const side=$(".book-side",el);
  const continueEntry = mostRecentInProgress(HISTORY, b.slug);
  R.continueEntry = continueEntry;
  if(full){
    const w=document.createElement("button");
    w.type="button"; w.className="whole"; w.dataset.on="0";
    const wholeHist = HISTORY[full.url];
    const mark = (wholeHist && wholeHist.played) ? ICON_CHECK : "";
    w.innerHTML=`${ICON_PLAY}<span>${esc(L.whole)}</span><small>${mark}${dur(full.seconds)}</small>`;
    w.addEventListener("click",()=>{
      R.expand();
      if(cur()?.slug===b.slug && cur()?.kind==="full"){ audio.paused?audio.play():audio.pause(); return; }
      start([mkTrack(b,"full",full,0,bLang)],0);
    });
    side.append(w); R.whole=w; R.fullTrack=mkTrack(b,"full",full,0,bLang);
    /* Right next to the play button, before the continue button — so on a
       book with something in progress (where the row wraps), download stays
       paired with "Full summary" on the first line instead of dropping to
       its own third line. */
    const dl=document.createElement("a");
    dl.className="whole-dl"; dl.href=full.url; dl.setAttribute("download","");
    dl.title=L.dlWhole; dl.setAttribute("aria-label",L.dlWhole); dl.innerHTML=ICON_DL;
    dl.addEventListener("click",()=>R.expand());
    side.append(dl);
    /* A whole-book entry in progress is already covered by the button above
       (load() resumes it automatically since it's the same URL) — a second
       button here would just duplicate it. Only chapters get their own
       continue button, since the "Full summary" button can't reach them. */
    if(continueEntry && continueEntry.kind!=="full"){
      const c=document.createElement("button");
      c.type="button"; c.className="whole"; c.dataset.on="0";
      const entryDir = continueEntry.lang==="en" ? "ltr" : "rtl";
      c.innerHTML=`${ICON_PLAY}<span>${esc(L.continue)}: <bdi dir="${entryDir}">${esc(continueEntry.label)}</bdi></span><small>${dur(continueEntry.duration)}</small>`;
      c.addEventListener("click",()=>{
        R.expand();
        if(cur() && cur().src===continueEntry.url){ audio.paused?audio.play():audio.pause(); return; }
        playHistoryEntry(continueEntry);
      });
      side.append(c); R.continueBtn=c;
    }
  } else {
    side.innerHTML=`<span class="mono missing">${esc(L.missing)}</span>`;
  }

  // spine + toc, segment width ∝ chapter length
  const spine=$(".spine",el), toc=$(".toc",el);
  const tracks=chapters.map((c,i)=>mkTrack(b,"chapter",c,i,bLang));
  R.tracks=tracks;
  chapters.forEach((c,i)=>{
    const title=chTitle(b.slug,c,bLang);
    const played = HISTORY[c.url] && HISTORY[c.url].played;
    const seg=document.createElement("button");
    seg.type="button"; seg.className="seg";
    if(played) seg.dataset.done="1";
    seg.style.flexGrow=String(Math.max((c.seconds||60)/60,1));
    seg.title=`${L.chShort} ${num(i+1)} — ${title}`;   // hover: no duration
    seg.setAttribute("aria-label",seg.title);
    seg.innerHTML=`<span class="seg-fill"></span>`;
    seg.addEventListener("click",()=>{ R.expand(); start(tracks,i); });
    spine.append(seg);
    R.segs.push(seg); R.fills.push($(".seg-fill",seg));

    const row=document.createElement("button");
    row.type="button"; row.className="ch";
    row.innerHTML=`<span class="ch-n">${String(i+1).padStart(2,"0")}</span>
      <span class="ch-t">${esc(title)}</span>
      <span class="ch-d mono">${played?`<span class="ch-played">${ICON_CHECK}</span>`:""}${dur(c.seconds)}</span>`;
    row.addEventListener("click",()=>start(tracks,i));

    const copy=document.createElement("button");
    copy.type="button"; copy.className="ch-act"; copy.innerHTML=ICON_LINK;
    copy.title=L.copyLink; copy.setAttribute("aria-label",L.copyLink);
    copy.addEventListener("click",()=>copyLink(trackLink(tracks[i]),copy));

    const dl=document.createElement("a");
    dl.className="ch-act"; dl.href=c.url; dl.setAttribute("download","");
    dl.title=L.download; dl.setAttribute("aria-label",L.download); dl.innerHTML=ICON_DL;

    const rowWrap=document.createElement("div"); rowWrap.className="ch-row";
    rowWrap.append(row,copy,dl);
    toc.append(rowWrap); R.chs.push(row);
  });

  const tog=$(".toc-toggle",el);
  const setLabel=()=>$(".toc-label",tog).textContent =
    tog.getAttribute("aria-expanded")==="true" ? L.hideToc : L.showToc;
  setLabel();
  tog.addEventListener("click",()=>{
    const on=tog.getAttribute("aria-expanded")==="true";
    tog.setAttribute("aria-expanded",String(!on));
    toc.hidden=on; setLabel();
  });
  R.expand=()=>{ if(tog.getAttribute("aria-expanded")!=="true") tog.click(); };
  if(!chapters.length){ $(".spine-wrap",el).style.display="none"; }
  return el;
}

/* Stable per-chapter id: the asset filename minus _en/_fa — the same key build_site.py
   uses in books.meta.json, so it means the same chapter in both languages. */
const chapterKey = url => url.split("/").pop().replace(/\.m4a$/,"").replace(/_(en|fa)$/,"");

function mkTrack(b,kind,ep,idx,lang){
  return { slug:b.slug, kind, idx, lang, key:chapterKey(ep.url),
    book:(META[b.slug]&&META[b.slug].title_en)||b.title||b.slug,
    label: kind==="full" ? t().whole : `${t().chShort} ${num(idx+1)} — ${chTitle(b.slug,ep,lang)}`,
    src:ep.url };
}

/* ---------------- playback ---------------- */
const cur = ()=>queue[qi];
function start(list,i,autoplay=true){ queue=list; qi=i; load(autoplay); }

/* ---------------- deep links ----------------
   #<slug>                        → a book
   #<slug>/full                   → its whole-book episode
   #<slug>/<chapter-key>          → one chapter

   Keyed by chapter, not by position: chapter numbering is per-language (a book with
   6 English and 3 Persian episodes numbers them differently) and shifts whenever a
   missing episode is generated, so a positional link would rot. The key resolves to
   the same chapter in either language, and to the book alone if that chapter has no
   episode in the language being viewed.

   A shared link loads the episode but never autoplays: browsers block unprompted
   sound anyway, and arriving to noise is hostile. */
const trackHash = tr => `${tr.slug}/${tr.kind==="full" ? "full" : tr.key}`;
const trackLink = tr => `${location.origin}${location.pathname}#${trackHash(tr)}`;

/* Clipboard needs a secure context — fine on GitHub Pages and localhost. If it is
   refused, fall back to a selectable prompt rather than failing silently. */
async function copyLink(url, btn){
  try{
    await navigator.clipboard.writeText(url);
  }catch{
    prompt(t().copyLink, url);
    return;
  }
  const was=btn.innerHTML;
  btn.innerHTML=ICON_CHECK; btn.classList.add("ok"); btn.title=t().copied;
  setTimeout(()=>{ btn.innerHTML=was; btn.classList.remove("ok"); btn.title=t().copyLink; },1400);
}

function openFromHash(){
  const [slug, ...rest] = decodeURIComponent(location.hash.slice(1)).split("/");
  const ep = rest.join("/");                        // keys may contain slashes
  const R = refs[slug];
  if(!R || !R.el || !R.el.isConnected) return;      // unknown slug, or filtered out
  R.el.scrollIntoView({behavior:"smooth", block:"start"});
  if(!ep) return;
  if(ep === "full" && R.fullTrack) return start([R.fullTrack], 0, false);
  const i = (R.tracks || []).findIndex(tr => tr.key === ep);
  if(i >= 0){ R.expand(); start(R.tracks, i, false); }
}
addEventListener("hashchange", openFromHash);
function load(autoplay){
  const tr=cur(); if(!tr) return;
  audio.src=tr.src;
  $("#pTitle").textContent=tr.label; $("#pTitle").classList.remove("err");
  $("#pSub").textContent=tr.book;
  $("#player").classList.add("on"); document.body.classList.add("has-player");
  mpSetTrack(tr); mp.classList.add("on");
  if(autoplay && mIsMobile()) mExpand();            // open expanded when they play something
  $("#prev").disabled = qi<=0;
  $("#next").disabled = qi>=queue.length-1;
  $("#plang").textContent = tr.lang==="en" ? "EN" : "فا";
  $("#plang").setAttribute("aria-pressed", tr.lang==="en" ? "true" : "false");
  const histEntry=HISTORY[tr.src];
  if(shouldResume(histEntry)){
    audio.addEventListener("loadedmetadata",()=>{ audio.currentTime=histEntry.position; },{once:true});
  }
  if(autoplay) audio.play().catch(fail);
  paintSpines();
}
/* Only a real media failure is "not found". play() also rejects when the browser
   blocks unprompted sound — restoring a session on reload, or a deep link — and the
   file is perfectly fine there; the player just stays paused until it is clicked. */
function fail(err){
  if(err && err.name==="NotAllowedError") return;
  $("#pTitle").textContent=t().notfound; $("#pTitle").classList.add("err"); paintSpines();
}
function paintSpines(){
  const tr=cur();
  for(const slug in refs){
    const R=refs[slug];
    const playingHere = tr && tr.slug===slug && !audio.paused;
    R.whole && (R.whole.dataset.on = (playingHere && tr.kind==="full")?"1":"0");
    R.continueBtn && (R.continueBtn.dataset.on = (playingHere && R.continueEntry && tr.src===R.continueEntry.url)?"1":"0");
    R.segs.forEach((s,i)=>{
      const now = tr&&tr.slug===slug&&tr.kind==="chapter"&&tr.idx===i;
      s.dataset.now = now?"1":"0";
      if(!now) R.fills[i].style.width="0";
      R.chs[i] && (R.chs[i].dataset.now = now?"1":"0");
    });
  }
  const on=!audio.paused;
  $("#toggle").innerHTML = on?ICON_PAUSE:ICON_PLAY;
  $("#toggle").setAttribute("aria-label", on?t().pause:t().play);
  mp.dataset.playing = on?"1":"0";
}

audio.addEventListener("play",paintSpines);
audio.addEventListener("pause",paintSpines);
audio.addEventListener("pause",()=>forceRecordProgress(false));
addEventListener("beforeunload",()=>forceRecordProgress(false));
audio.addEventListener("error",()=>{ if(audio.src) fail(); });
audio.addEventListener("ended",()=>{
  const tr=cur();
  if(tr){
    const R=refs[tr.slug];
    if(R&&tr.kind==="chapter"){
      R.segs[tr.idx].dataset.done="1";
      if(R.chs[tr.idx] && !R.chs[tr.idx].querySelector(".ch-played")){
        const d=$(".ch-d",R.chs[tr.idx]);
        d&&d.insertAdjacentHTML("afterbegin", `<span class="ch-played">${ICON_CHECK}</span>`);
      }
    }
  }
  forceRecordProgress(true);
  if(qi<queue.length-1){ qi++; load(true); } else { paintSpines(); }
});
audio.addEventListener("timeupdate",()=>{
  if(!audio.duration) return;
  const p=audio.currentTime/audio.duration;
  $("#scrubFill").style.width=p*100+"%";
  $("#scrubThumb").style.insetInlineStart=p*100+"%";
  $("#scrub").setAttribute("aria-valuenow",String(Math.round(p*100)));
  $("#pCur").textContent=clock(audio.currentTime);

  $("#mpDur").textContent=faDigits(clock(audio.duration));
  const tr=cur();
  if(tr&&tr.kind==="chapter"){ const R=refs[tr.slug]; R&&R.fills[tr.idx]&&(R.fills[tr.idx].style.width=p*100+"%"); }
  maybeRecordProgress();
});

$("#toggle").addEventListener("click",()=>audio.paused?audio.play().catch(fail):audio.pause());
$("#prev").addEventListener("click",()=>{ if(qi>0){ qi--; load(true); } });
$("#next").addEventListener("click",()=>{ if(qi<queue.length-1){ qi++; load(true); } });

/* playback speed — shared by the desktop pill (cycles) and the mobile radial menu (selects) */
const SPEEDS=[0.5,0.75,1,1.25,1.5,2];
let RATE=parseFloat(localStorage.getItem("abs-rate")); if(!SPEEDS.includes(RATE)) RATE=1;
function applyRate(){
  audio.playbackRate=RATE;
  $("#speed").textContent=RATE+"×";                                  // desktop pill "1.5×"
  $$(".mp-speed").forEach(e=>e.textContent="×"+RATE);                 // mobile pills "×1.5"
  $$(".mspeed-opt").forEach(b=>b.classList.toggle("on",parseFloat(b.dataset.rate)===RATE));
}
function setRate(r){ RATE=r; localStorage.setItem("abs-rate",r); applyRate(); }
$("#speed").addEventListener("click",()=>setRate(SPEEDS[(SPEEDS.indexOf(RATE)+1)%SPEEDS.length]));
audio.addEventListener("loadedmetadata",applyRate);   // browsers reset rate on new src → reassert
applyRate();                                          // set labels + rate at boot
$("#close").addEventListener("click",stopPlayer);
function scrubRatio(clientX){
  const r=$("#scrub").getBoundingClientRect();
  const x = document.dir==="rtl" ? r.right-clientX : clientX-r.left;
  return Math.min(Math.max(x/r.width,0),1);
}
function seekTo(ratio){
  if(!audio.duration) return;
  audio.currentTime = ratio*audio.duration;
  $("#scrubFill").style.width=(ratio*100)+"%";
  $("#scrubThumb").style.insetInlineStart=(ratio*100)+"%";
  $("#scrub").setAttribute("aria-valuenow",String(Math.round(ratio*100)));
}
let scrubbing=false;
$("#scrub").addEventListener("pointerdown",e=>{
  if(!audio.duration) return;
  scrubbing=true; e.currentTarget.setPointerCapture(e.pointerId);
  seekTo(scrubRatio(e.clientX));
});
$("#scrub").addEventListener("pointermove",e=>{ if(scrubbing) seekTo(scrubRatio(e.clientX)); });
$("#scrub").addEventListener("pointerup",()=>{ scrubbing=false; });
$("#scrub").addEventListener("pointercancel",()=>{ scrubbing=false; });
$("#scrub").addEventListener("keydown",e=>{
  if(!audio.duration) return;
  if(e.key==="ArrowRight") audio.currentTime=Math.min(audio.duration,audio.currentTime+5);
  else if(e.key==="ArrowLeft") audio.currentTime=Math.max(0,audio.currentTime-5);
  else return;
  e.preventDefault();
});
document.addEventListener("keydown",e=>{
  if(e.code==="Space" && cur() && !/^(BUTTON|A|INPUT)$/.test(document.activeElement.tagName)){
    e.preventDefault(); audio.paused?audio.play().catch(fail):audio.pause();
  }
});

const qBox=$("#q"), qClear=$("#qClear");
function runSearch(){
  Q = norm(qBox.value);
  qClear.hidden = !qBox.value;

  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) || dlg.open) return;

function resume(keep, ratio, lang){
  const b=(DATA.books||[]).find(x=>x.slug===keep.slug); if(!b) return;
  const {full,chapters}=split(b, lang);
  if(keep.kind==="full"){
    if(!full) return; queue=[mkTrack(b,"full",full,0,lang)]; qi=0;
  } else {
    if(!chapters[keep.idx]) return;
    queue=chapters.map((c,i)=>mkTrack(b,"chapter",c,i,lang)); qi=keep.idx;
  }
  load(false);
  audio.addEventListener("loadedmetadata",()=>{ if(audio.duration) audio.currentTime=ratio*audio.duration; },{once:true});
  if(keep.playing) audio.play().catch(fail);
}

/* Switch one book's language — used by that book's card toggle and the
   player-bar toggle. If the currently playing track belongs to this book,
   the equivalent chapter in the new language starts at the same position
   (same idea as the old site-wide toggle, just scoped to one book); every
   other book and the page chrome are untouched. */
function switchBookLang(slug, newLang){
  const tr=cur(), playingThisBook = tr && tr.slug===slug;
  const ratio = playingThisBook && audio.duration ? audio.currentTime/audio.duration : 0;
  const keep = playingThisBook ? {slug, kind:tr.kind, idx:tr.idx, playing:!audio.paused} : null;
  setBookLang(slug, newLang);
  render();
  if(keep) resume(keep, ratio, newLang);
}

/* Resume a specific history entry — used by the continue-listening row and a
   book's own "Continue: <episode>" button. If the entry's language differs from
   what this book is currently showing, switch first; the saved position itself
   is restored automatically by load()'s own check. */
function playHistoryEntry(entry){
  const b=(DATA.books||[]).find(x=>x.slug===entry.slug); if(!b) return;
  if(getBookLang(entry.slug)!==entry.lang){ setBookLang(entry.slug, entry.lang); render(); }
  const {full,chapters}=split(b, entry.lang);
  if(entry.kind==="full"){
    if(!full) return;
    start([mkTrack(b,"full",full,0,entry.lang)],0);
  }else{
    let i = chapters.findIndex(c=>c.url===entry.url);
    if(i<0) i = entry.idx;
    if(!chapters[i]) return;
    start(chapters.map((c,j)=>mkTrack(b,"chapter",c,j,entry.lang)), i);
  }
}

function renderContinueRow(){
  const wrap=$("#continueWrap"), row=$("#continueRow");
  const entries = DATA ? continueListening(HISTORY) : [];
  if(!entries.length){ wrap.hidden=true; row.innerHTML=""; return; }
  const L=t();
  row.innerHTML="";
  entries.forEach(e=>{
    const cover=(META[e.slug]&&META[e.slug].cover)||"";
    const pct = e.duration ? Math.min(100, Math.round((e.position/e.duration)*100)) : 0;
    const card=document.createElement("button");
    card.type="button"; card.className="continue-card";
    card.innerHTML=`
      ${cover?`<img class="continue-cover" src="${esc(cover)}" alt="" loading="lazy" onerror="this.remove()">`:""}
      <span class="continue-book">${esc(e.book)}</span>
      <span class="continue-ep">${esc(e.label)}</span>
      <span class="continue-bar"><span class="continue-bar-fill" style="width:${pct}%"></span></span>`;
    card.addEventListener("click",()=>playHistoryEntry(e));
    row.append(card);
  });
  $(".continue-title",wrap).textContent=L.continueTitle;
  wrap.hidden=false;
}

/* ---------------- likes / dislikes (Supabase) ---------------- */
function paintVotes(){
  for(const slug in refs){
    const R=refs[slug]; if(!R.vote) continue;
    const v=VOTES[slug]||{up:0,down:0}, mine=MYVOTE[slug];
    R.vote.upN.textContent=num(v.up); R.vote.downN.textContent=num(v.down);
    R.vote.up.setAttribute("aria-pressed",String(mine===1));
    R.vote.down.setAttribute("aria-pressed",String(mine===-1));
  }
}
async function loadVotes(){
  try{
    const [all,mine]=await Promise.all([
      fetch(SB_URL+"/votes?select=slug,value",{headers:SB_H}).then(r=>r.json()),
      fetch(SB_URL+"/votes?select=slug,value&voter=eq."+voterId(),{headers:SB_H}).then(r=>r.json()),
    ]);
    VOTES={}; (all||[]).forEach(r=>{ const v=VOTES[r.slug]||(VOTES[r.slug]={up:0,down:0}); r.value===1?v.up++:v.down++; });
    MYVOTE={}; (mine||[]).forEach(r=>MYVOTE[r.slug]=r.value);
    paintVotes();
  }catch{ /* offline → counts stay at 0 */ }
}
async function castVote(slug,value){
  const prev=MYVOTE[slug];
  if(prev===value) return;                 // no un-vote (delete is blocked by design)
  const v=VOTES[slug]||(VOTES[slug]={up:0,down:0});
  const apply=(pv,nv)=>{ if(pv===1)v.up--; if(pv===-1)v.down--; if(nv===1)v.up++; if(nv===-1)v.down++; };
  apply(prev,value); MYVOTE[slug]=value; paintVotes();   // optimistic
  try{
    const r=await fetch(SB_URL+"/votes",{ method:"POST",
      headers:{...SB_H,"Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({slug,voter:voterId(),value}) });
    if(!r.ok) throw 0;
  }catch{ apply(value,prev); MYVOTE[slug]=prev; paintVotes(); }  // revert
}

  const btn=$("#suggestSend"); btn.disabled=true; sMsg.hidden=false; sMsg.classList.remove("err"); sMsg.textContent=t().sending;
  try{
    const r=await fetch(SB_URL+"/suggestions",{ method:"POST",
      headers:{...SB_H,"Prefer":"return=minimal"},
      body:JSON.stringify({ title, author:(fd.get("author")||"").trim()||null,
        lang:"fa", why:(fd.get("why")||"").trim()||null }) });
    if(!r.ok) throw 0;
    sMsg.textContent=t().sent; sForm.reset();
    setTimeout(()=>dlg.close(),1300);
  }catch{ sMsg.classList.add("err"); sMsg.textContent=t().sendErr; }
  finally{ btn.disabled=false; }
});

/* ---------------- mobile player: expand on play, auto-collapse ---------------- */
const mp=$("#mplayer");
const mIsMobile=()=>matchMedia("(max-width:680px)").matches;
let mExpandedAt=0;
function mExpand(){ mp.dataset.state="expanded"; mExpandedAt=Date.now(); }
function mCollapse(){ mp.dataset.state="collapsed"; }
function faDigits(s){ return s.replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[+d]); }
function stopPlayer(){
  audio.pause(); audio.removeAttribute("src"); queue=[]; qi=-1;
  $("#player").classList.remove("on"); document.body.classList.remove("has-player");
  mp.classList.remove("on");
  paintSpines();
}
function mpSetTrack(tr){
  $$(".mp-title").forEach(e=>e.textContent=tr.label);   // collapsed mini bar (chapter label)
  $("#mpBook").textContent=tr.book;                     // expanded: book name (prominent)
  $("#mpChap").textContent=tr.label;                    // expanded: chapter/episode name
  const meta=META[tr.slug]||{}, cov=meta.cover||"", ph="کاور";
  $("#mpCover").innerHTML = cov
    ? `<img src="${esc(cov)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.replaceWith(document.createTextNode('${ph}'))">`
    : ph;
}
function mDownload(){ const tr=cur(); if(!tr) return; const a=document.createElement("a"); a.href=tr.src; a.download=""; document.body.appendChild(a); a.click(); a.remove(); }
async function mShare(){
  const tr=cur(); if(!tr) return;
  const url=trackLink(tr);          // links to this episode, not just the site
  try{
    if(navigator.share) await navigator.share({title:tr.label,text:tr.book,url});
    else if(navigator.clipboard) await navigator.clipboard.writeText(url);
  }catch{}
}
mp.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  switch(b.dataset.act){
    case "toggle": audio.paused?audio.play().catch(fail):audio.pause(); break;
    case "back":   audio.currentTime=Math.max(0,(audio.currentTime||0)-15); break;
    case "fwd":    if(audio.duration) audio.currentTime=Math.min(audio.duration,audio.currentTime+15); break;
    case "prev":   if(qi>0){ qi--; load(true); } break;
    case "next":   if(qi<queue.length-1){ qi++; load(true); } break;
    case "close":  stopPlayer(); break;
    case "expand": mExpand(); break;
    case "collapse": mCollapse(); break;
    case "download": mDownload(); break;
    case "share":  mShare(); break;
    case "speed":  $("#mpSpeedMenu").hidden=!$("#mpSpeedMenu").hidden; break;
    case "speedclose": $("#mpSpeedMenu").hidden=true; break;
    case "setspeed": setRate(parseFloat(b.dataset.rate)); $("#mpSpeedMenu").hidden=true; break;
  }
});
// collapse while playing when the user scrolls or interacts elsewhere (not right after expanding)
function maybeCollapse(){
  if(!audio.paused && mp.classList.contains("on") && mp.dataset.state==="expanded"
     && mIsMobile() && Date.now()-mExpandedAt>400) mCollapse();
}
addEventListener("scroll",maybeCollapse,{passive:true});
addEventListener("touchmove",maybeCollapse,{passive:true});
document.addEventListener("click",e=>{ if(!e.target.closest("#mplayer")) maybeCollapse(); });

/* boot — manifest is required (generated); books.meta.json is optional (hand-edited) */
Promise.all([
  fetch("manifest.json?"+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.json(); }),
  fetch("books.meta.json?"+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),
])
  .then(([d,meta])=>{ DATA=d; META=meta||{}; render(); openFromHash(); loadVotes(); })
  .catch(()=>{ render(); const m=$("#msg"); m.hidden=false; m.textContent=t().error; });
</script>
